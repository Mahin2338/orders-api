services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      APP_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://orders_user:orders_password@db:5432/orders
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
